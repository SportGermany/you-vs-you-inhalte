name: Ablaufende Inhalte

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lektionen, die in 30 Tagen ablaufen
        run: python3 content-tools/expiring.py --tage 30
